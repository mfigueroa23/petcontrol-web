# Pipeline de integración continua (CDM-3, SDD 5.4).
# En cada PR y push a main: formato, lint, pruebas unitarias y pruebas de sistema
# con Playwright sobre la imagen construida. Solo en main, y si todo se aprueba,
# publica en Docker Hub la misma imagen probada con la etiqueta de su versión.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 26
  IMAGE_NAME: petcontrol-web

jobs:
  version:
    name: Versión
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Leer la versión de package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Evita sobrescribir una versión publicada: cada PR debe subir la versión.
      - name: Comprobar que la versión no esté publicada
        env:
          IMAGE: ${{ secrets.DOCKERHUB_ORGANIZATION }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::La versión $VERSION ya está publicada en Docker Hub. Sube la versión en package.json."
            exit 1
          fi
          echo "La versión $VERSION no está publicada."

  quality:
    name: Formato, lint y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar el formato
        run: pnpm format:check

      - name: Revisar el código
        run: pnpm lint

      - name: Pruebas unitarias
        run: pnpm test --watch=false

  e2e:
    name: Pruebas de sistema (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@v4

      - name: Construir la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Levantar el contenedor web
        run: |
          docker run -d --name web -p 8080:8080 "$IMAGE_NAME:ci"
          timeout 30 sh -c 'until curl -fs http://localhost:8080/healthz; do sleep 1; done'

      - name: Instalar los navegadores
        run: pnpm exec playwright install --with-deps chromium msedge firefox webkit

      - name: Pruebas de sistema
        run: pnpm e2e

      - name: Logs del contenedor
        if: failure()
        run: docker logs web

      - name: Guardar el reporte de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Exportar la imagen probada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "$IMAGE_NAME:ci" | gzip > image.tar.gz

      - name: Guardar la imagen probada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  publish:
    name: Publicar en Docker Hub
    needs: [version, quality, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar la imagen probada
        uses: actions/download-artifact@v8
        with:
          name: image

      - name: Cargar la imagen
        run: gunzip -c image.tar.gz | docker load

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Etiquetar y publicar
        env:
          IMAGE: ${{ secrets.DOCKERHUB_ORGANIZATION }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for TAG in "$VERSION" latest; do
            docker tag "$IMAGE_NAME:ci" "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          done
